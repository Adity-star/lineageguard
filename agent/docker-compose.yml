version: '3.8'

services:
  lineageguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lineageguard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATAHUB_GMS_URL=${DATAHUB_GMS_URL:-http://datahub-gms:8080}
      - DATAHUB_GMS_TOKEN=${DATAHUB_GMS_TOKEN}
      - DATAHUB_MCP_URL=${DATAHUB_MCP_URL:-http://datahub-gms:8080}
      - DATAHUB_MCP_TOKEN=${DATAHUB_MCP_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
      - GITHUB_BASE_BRANCH=${GITHUB_BASE_BRANCH:-main}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - datahub-gms
    networks:
      - lineageguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  datahub-gms:
    image: acryldata/datahub-gms:latest
    container_name: datahub-gms
    ports:
      - "8080:8080"
    environment:
      - DATAHUB_GMS_URL=http://localhost:8080
      - DATAHUB_SERVER_NAME=datahub
      - DATAHUB_TELEMETRY_ENABLED=false
      - DATAHUB_TRACKING_ENABLED=false
      - KAFKA_BOOTSTRAP_SERVER=broker:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - KAFKA_CONSUMER_MAX_POLL_RECORDS=500
      - KAFKA_CONSUMER_SESSION_TIMEOUT_MS=60000
      - KAFKA_CONSUMER_REQUEST_TIMEOUT_MS=40000
      - KAFKA_PRODUCER_REQUEST_TIMEOUT_MS=40000
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_PROTOCOL=http
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=datahub
      - NEO4J_PASSWORD=datahub
      - DATAHUB_MYSQL_PASSWORD=datahub
      - DATAHUB_MYSQL_USERNAME=datahub
      - DATAHUB_MYSQL_DATABASE=datahub
      - DATAHUB_MYSQL_HOST=mysql
      - DATAHUB_MYSQL_PORT=3306
    depends_on:
      - broker
      - elasticsearch
      - neo4j
      - mysql
    networks:
      - lineageguard-network
    restart: unless-stopped

  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker
    hostname: broker
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_CONFLUENT_METRICS_REPORTER_TOPIC_ENABLE: "false"
      KAFKA_CONFLUENT_METRICS_ENABLE: "false"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: broker
    networks:
      - lineageguard-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    networks:
      - lineageguard-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/datahub
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=512m
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - lineageguard-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=datahub
      - MYSQL_DATABASE=datahub
      - MYSQL_USER=datahub
      - MYSQL_PASSWORD=datahub
    ports:
      - "3306:3306"
    networks:
      - lineageguard-network
    restart: unless-stopped

networks:
  lineageguard-network:
    driver: bridge

volumes:
  datahub-data:
