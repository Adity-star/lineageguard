services:
  # Backend Agent API
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: lineageguard-agent
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATAHUB_GMS_URL=${DATAHUB_GMS_URL:-http://datahub:8080}
      - DATAHUB_GMS_TOKEN=${DATAHUB_GMS_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-}
      - GITHUB_BASE_BRANCH=${GITHUB_BASE_BRANCH:-main}
      - DATABASE_URL=${DATABASE_URL:-postgresql://lineageguard:lineageguard@postgres:5432/lineageguard}
    networks:
      - lineageguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web App
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: lineageguard-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    networks:
      - lineageguard-network
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (optional - for production use)
  postgres:
    image: postgres:16-alpine
    container_name: lineageguard-postgres
    environment:
      - POSTGRES_DB=lineageguard
      - POSTGRES_USER=lineageguard
      - POSTGRES_PASSWORD=lineageguard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lineageguard-network
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineageguard"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  lineageguard-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
